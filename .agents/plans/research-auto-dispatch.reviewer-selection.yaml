reviewer_selection_judge:
  verdict: add_optional_reviewers
  baseline_reviewers:
    - implementation-readiness
    - edge-cases-and-risks
    - simplification-and-scope-control
    - refactoring-opportunities
  selected_optional_reviewers:
    - docs-and-agent-alignment
    - ax-and-skill-compatibility
  rationale:
    default: >-
      The baseline reviewers are required for all plan-ready outputs. The plan
      changes one atomic shared skill behavior and should remain scoped to one
      delivery unit.
    docs-and-agent-alignment: >-
      The plan updates reusable skill semantics, tests, and research skill
      family documentation, so documentation and agent behavior alignment must
      be reviewed.
    ax-and-skill-compatibility: >-
      The plan updates SKILL.md behavior and OpenAI adapter prompt semantics,
      then refreshes managed skill installations, so runtime skill
      compatibility must be reviewed.
