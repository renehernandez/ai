reviewer_selection_judge:
  verdict: add_optional_reviewers
  baseline_reviewers:
    - implementation-readiness
    - edge-cases-and-risks
    - simplification-and-scope-control
    - refactoring-opportunities
  optional_reviewer_catalog:
    - docs-and-agent-alignment: docs, agent instructions, skill/rule updates, automation prompts, background-review rubrics, PR description expectations
    - ax-and-skill-compatibility: skill structure, SKILL.md conventions, adapter prompts, install/update paths, bundled scripts, internal subagent routing, runtime compatibility
  selected_optional_reviewers:
    - docs-and-agent-alignment
    - ax-and-skill-compatibility
  rationale:
    docs-and-agent-alignment: The plan changes reusable skill behavior and PR/MR description contracts, including template preservation and reviewer-facing evidence expectations.
    ax-and-skill-compatibility: The plan adds a managed skill entrypoint and changes adapter prompt boundaries plus runtime skill validation expectations.
