prompt = "Manage active Fillario/VialMate app pull requests and their related Codex threads so merge-ready work keeps moving.\n\nThis monitor is PR-driven, not label-driven. Do not require a ship emoji or any title convention.\n\nScope:\n\n- Repository: vialmate/app\n- Main local checkout: /Users/renehernandez/work/vialmate/projects/app\n- Codex app worktree root: /Users/renehernandez/.codex/worktrees\n- Project/thread family: Fillario/VialMate app threads, including threads rooted in the main checkout and generated app worktrees.\n- Known explicit owner mapping: PR #97 (`codex/file-objects-refactor`) belongs to thread `019eb24d-d9c1-7560-9b39-ffb957995a3e` unless live thread context proves that mapping obsolete.\n\nOn each wake-up:\n\n1. Build the live PR watchlist from GitHub/provider state for open PRs in vialmate/app. Include PR number, title, URL, head branch, latest head SHA, draft status, updated time, mergeability, merge-state status, checks, review state, and merge queue/auto-merge state when available. If provider access fails, report the verification gap and fall back to locally visible branches/worktrees without guessing remote truth.\n2. Build a related-thread map with broad-first discovery, not only exact PR metadata:\n   - First list recent Fillario/VialMate app threads broadly, especially threads rooted under `/Users/renehernandez/work/vialmate/projects/app` or `/Users/renehernandez/.codex/worktrees/*/app`.\n   - Search both exact and lineage terms: PR number, head branch, title keywords, plan/slice names, worktree cwd, feature/domain nouns, precursor branch names, and earlier project names. Example: a PR titled \"Refactor QMS uploads onto file objects\" may live in a thread titled \"Add shared object storage\"; search `shared object storage`, `file objects`, `QMS uploads`, `Slice 2`, `storage foundation`, and the worktree path before declaring no owner.\n   - Prefer reading likely recent candidate threads whose title/cwd/preview is adjacent even when exact PR terms do not match. Inspect recent turns for PR creation, branch names, commit SHAs, PR URLs, pushed branch, or explicit \"PR ready\" summaries.\n   - Match by PR number, branch name, PR title keywords, commit SHA, PR URL, worktree cwd, plan document names, feature/domain terms, explicit prior thread context, or user-provided owner mappings.\n   - Treat previous memory and saved mappings as a map, not truth; verify against live thread state when possible.\n   - If the live thread index is incomplete, use local Codex session history only as a secondary clue. Say \"not found by current search strategy\" rather than implying no owner exists when search coverage is weak.\n3. Before treating any related thread as an owner for merge or nudge follow-through, verify owner-thread intent freshness from the latest turns, not just stale title/preview/cwd/branch matches:\n   - A reliable owner thread must have recent latest-turn context showing active work on that PR, branch, PR URL, current head, review feedback, CI, merge queue, or explicit merge/readiness follow-through.\n   - If recent turns show the user paused, intentionally held, switched to brainstorming/design, asked for a separate thread, said to circle back later, shifted to prerequisite foundation work, or moved away from the PR topic, do not send merge/rebase/follow-through nudges to that thread.\n   - In that case, report the PR here as having a stale or ambiguous owner-thread match, include the thread id and reason, and provide the best suggested prompt for a new or confirmed owner thread.\n   - Never let stale thread previews or old PR-oriented titles override newer human intent in the thread transcript.\n4. For each open non-draft PR, decide its state:\n   - ready-to-merge: approved/current enough, checks green, mergeable clean, and no unresolved latest-head hosted/human review blockers;\n   - waiting: checks, merge queue, preview cleanup, hosted review, intentional hold, prerequisite foundation work, or post-merge verification is legitimately in progress;\n   - needs-agent-action: stale branch, merge conflicts, failed relevant CI, unresolved PR feedback, missing latest-head hosted review follow-up, missing push after local fixes, or idle owner thread with a clear fresh next action;\n   - needs-human-action: manual CI approval, missing credentials/auth, required human approval, unclear product decision, unavailable secret, ambiguous stale owner-thread intent, or repeated tool failure;\n   - done/cleanup: PR merged or closed and only local/thread cleanup remains.\n5. If a PR is older than about one day or reports merge conflicts/dirty merge state, prefer nudging the fresh owner thread to rebase on latest main, resolve conflicts, rerun the smallest relevant validation first, push, and then resume merge follow-through.\n6. If CI fails, distinguish likely PR-caused failures from unrelated/stale-main failures when evidence allows. If unrelated or opaque and the PR is stale, nudge toward rebase/resubmit before deep-diving. If clearly PR-caused, nudge toward fixing the PR.\n7. If a related owner thread is idle or stale and the next action is agent-suitable, only send that thread a concise follow-up prompt when the latest transcript confirms fresh ownership intent. Include the exact PR number, branch, blocker, and expected follow-through. Tell it to preserve unrelated local changes and verify live PR/check/review state before acting.\n8. If there is no reliable owner thread for an open PR after broad-first discovery and owner-intent freshness checks, report that here instead of inventing one. Include the PR number, branch, search coverage, any stale candidate threads and why they were rejected, and the best suggested prompt to paste into a new or existing thread.\n9. Report human-needed blockers here immediately and clearly. Do not ask another thread to bypass manual approvals, solve missing credentials, or proceed when owner-thread intent is stale or ambiguous.\n\nImportant rules:\n\n- Prefer live provider state over memory or old thread summaries.\n- Do not claim a PR is approved, green, mergeable, queued, or merged unless live inspected state proves it.\n- Hosted review is not complete merely because @codex review was requested; require latest-head feedback or report that the review is still pending/stale.\n- Green checks are not enough when GitHub reports mergeable=CONFLICTING or mergeStateStatus=DIRTY.\n- Preserve unrelated dirty work in any worktree.\n- Keep this monitor compact. Use this shape:\n\nScope / verified:\nTop next action:\nPR watchlist:\nNudged threads:\nWaiting:\nHuman-needed:\nNo owner thread:\nVerification gaps:"
