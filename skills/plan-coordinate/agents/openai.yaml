interface:
  display_name: "Plan Coordinate"
  short_description: "Coordinate an atomic plan or next OpenSpec task"
  default_prompt: "/goal Use $plan-coordinate with this plan_coordinate_handoff or OpenSpec change: <handoff or change>. For atomic plans, validate the handoff and pass exactly one approved unit to $plan-to-pr. For OpenSpec changes, validate OpenSpec, resolve and refresh the target branch and publishing remote, record the target commit, read tasks.md from target state, select the first unchecked deliverable task, and pass exactly that task to $plan-to-pr. Do not create a ledger. Reject legacy plan_ready_handoff, reviewed_slices, slice_plan_review, plan_followthrough_slice_handoff, and followthrough-ledger inputs with needs_plan_ready."
