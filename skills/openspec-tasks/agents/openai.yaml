interface:
  display_name: "OpenSpec Tasks"
  short_description: "Audit OpenSpec checkbox tasks for delivery fit"
  default_prompt: "Use $openspec-tasks for <openspec/changes/change-id/tasks.md>. Audit outcome-oriented delivery units and work items without expanding them into file lists, commands, exhaustive cases, or test logs. Block lifecycle-only, validation-only, proof-only, broad, or late-proof task shapes; objective proof must name the real entrypoint and visible success or failure in unit 1, or unit 2 after at most one setup-only unit. Do not rewrite tasks.md, ask the user directly, add schema extensions, or create parallel planning state. Return structured blockers to Plan and return the first unchecked delivery unit or needs_human_action only after the audit passes."
