interface:
  display_name: "OpenSpec Tasks"
  short_description: "Audit OpenSpec checkbox tasks for delivery fit"
  default_prompt: "Use $openspec-tasks for <openspec/changes/change-id/tasks.md>. Read tasks.md, parse checkbox tasks in document order, verify each checkbox maps to one minor deliverable, classify manual deployment monitoring and external-prerequisite tasks separately from deliverable tasks, and block broad phase tasks. Lifecycle-only, validation-only, proof-only, and manual-looking proof task shapes must return needs_spec_redesign with invalid task details; then ask whether to redo the spec, brainstorm a better breakdown, narrow scope, or choose another planning route. Do not rewrite tasks.md automatically, add tags or schema extensions, or create slice_plan_review. Return the first unchecked deliverable task or needs_human_action evidence only after the audit passes."
