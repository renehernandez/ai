interface:
  display_name: "Plan Unit Sequencer"
  short_description: "Orchestrate atomic or multi-step plan delivery"
  default_prompt: "/goal Use $plan-unit-sequencer with this planning_review handoff: <handoff>. Validate planning_review before selecting any implementation unit. For atomic plans, derive exactly one plan_delivery_handoff stacked on the reviewed planning artifact and pass it to $plan-unit-delivery. For OpenSpec changes, normalize delivery_goal as next_task, complete_change, or bounded_sequence. Direct sequencer invocation may use next_task, but plan-orchestrator callers must select with --caller plan_orchestrator so the effective goal is complete_change. Validate OpenSpec, resolve target branch and publishing remote, inspect the reviewed planning stack base and current stack tip, record the stack-tip selection commit, read tasks.md from stack-tip state, select the first unchecked deliverable task, and pass exactly that task to $plan-unit-delivery. Require each selected OpenSpec task to be delivered as one separate stacked PR/MR; multiple commits inside that PR/MR are allowed. Write a concise Readable Summary before any YAML or JSON handoff/status so the thread is scannable on mobile. Let $plan-unit-delivery own implementation reviewer subagents and latest-head Nitro gate closure for each unit. Continue only after the current implementation MR has passed latest-head Nitro review, verify cumulative stack-tip task state, then stack the next unit on the stack tip. Finish complete_change only with stack_ready evidence. Do not create a ledger. Reject missing planning_review with needs_reviewed_planning and reject legacy plan_coordinate_handoff, plan_ready_handoff, reviewed_slices, slice_plan_review, plan_followthrough_slice_handoff, and followthrough-ledger inputs with needs_plan_ready."
