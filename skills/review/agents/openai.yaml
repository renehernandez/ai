interface:
  display_name: "Review"
  short_description: "Run bounded required review coverage and closure"
  default_prompt: "Use $review read-only for every phase-specific review type against the exact hosted target. Cover a small coherent change inline or delegate only when faster, join at one phase barrier, return one findings batch, and run closure only for affected types and proof. Require one evidenced resolution per repair finding, including every invalidated surface, and start fresh discovery only for a material contract or review-risk change. Consume commit-hook suite evidence, emit the compact receipt from already collected state, and produce a fresh technical-readiness checkpoint after draft publication and hosted-review request."
