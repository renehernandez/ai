interface:
  display_name: "Plan To PR"
  short_description: "Plan, implement, review, and reach green artifact-host CI"
  default_prompt: "/goal Use $plan-to-pr for <feature>. Write the plan, announce each helper skill when it starts, run an explicit plan-review loop until the verdict is clean, run $scrutinize on the plan before coding, implement the approved plan or first approved slice, run local review, run $scrutinize on the implementation diff, run docs alignment, use $review-feedback-routing to select artifact host and review feedback, open or update the PR/MR through the routed artifact host, run the artifact-host review adapter, wait for routed review feedback on the latest PR/MR head, iterate until feedback is resolved, watch artifact-host CI, finish only when CI is green or blocked with evidence, and include a final gate ledger showing each helper skill and verdict."
