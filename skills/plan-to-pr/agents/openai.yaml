interface:
  display_name: "Plan To PR"
  short_description: "Implement a ready plan through review and CI"
  default_prompt: "/goal Use $plan-to-pr with this plan_ready_handoff: <handoff>. Validate the handoff, inspect live repo and routing state, inspect the approved slice's Refactoring / Reuse section, print and maintain refactoring_execution, implement only the approved slice, run local verification with the Fastest Durable Regression rule when coverage gaps appear, launch implementation reviewers through internal Codex subagents instead of dispatch or Claude, launch or explicitly skip $ai-readiness-upkeep with not-applicable evidence, print the launched reviewer report with returned subagent IDs in-session, validate the launch report, reconcile and validate reviewer outcomes including any ai_readiness_upkeep_report, run $review-feedback-routing, open or update the routed PR/MR, run artifact-host review, wait for routed latest-head feedback, iterate until feedback is resolved, watch artifact-host CI, finish only when CI is green or blocked with evidence, and include the validated final reviewer subagent report and delivery gate ledger."
