interface:
  display_name: "Plan To PR"
  short_description: "Implement a ready plan through review and CI"
  default_prompt: "/goal Use $plan-to-pr with this plan_ready_handoff: <handoff>. Validate the handoff, inspect live repo and routing state, implement only the approved slice, run local verification, local review, $scrutinize on the implementation diff, code quality, simplification, deslop, conditional security review, docs alignment, $review-feedback-routing, open or update the routed PR/MR, run artifact-host review, wait for routed latest-head feedback, iterate until feedback is resolved, watch artifact-host CI, finish only when CI is green or blocked with evidence, and include the validated final delivery gate ledger."
