interface:
  display_name: "Plan To PR"
  short_description: "Implement a ready plan through review and CI"
  default_prompt: "/goal Use $plan-to-pr with this plan_followthrough_slice_handoff or plan_ready_handoff: <handoff>. Validate the handoff, inspect reviewed_slices as upfront slice-plan evidence, inspect any followthrough_context, inspect live repo and routing state, inspect the approved slice's Refactoring / Reuse section, print and maintain refactoring_execution, implement only approved_slice, keep minor local behavior-preserving refactors in-slice, do not hunt for significant refactors, record naturally discovered significant_refactor_suggestions as nonblocking carry-forward unless they invalidate the approved slice, run local verification with the Fastest Durable Regression rule when coverage gaps appear, launch implementation reviewers through internal Codex subagents instead of dispatch or Claude, launch or explicitly skip $ai-readiness-upkeep with not-applicable evidence, print the launched reviewer report with returned subagent IDs in-session, validate the launch report, reconcile and validate reviewer outcomes including any ai_readiness_upkeep_report, run $review-feedback-routing, open or update the routed PR/MR, run artifact-host review, wait for routed latest-head feedback, treat missing stale timed-out or unresolved required review feedback as blocking, iterate until feedback is resolved, watch artifact-host CI, finish with the exact delivery state: shipped only when landed or directly published, stacked_pending_merge only when stack_then_continue allows it with passed latest-head review feedback, or blocked with evidence, include the validated final reviewer subagent report and delivery gate ledger, and include plan_followthrough_delivery when followthrough_context is present."
