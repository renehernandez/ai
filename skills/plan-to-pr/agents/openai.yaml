interface:
  display_name: "Plan To PR"
  short_description: "Implement one approved unit through review and CI"
  default_prompt: "/goal Use $plan-to-pr with this plan_coordinate_handoff: <handoff>. Validate the handoff, inspect live repo and routing state, implement exactly the approved_unit, and if the route is openspec_task mark only that OpenSpec task checkbox complete in the same PR/MR as the implementation. Keep minor local behavior-preserving refactors inside the approved unit, record naturally discovered significant_refactor_suggestions as nonblocking carry-forward unless they invalidate the approved unit, run local verification named by the handoff plus the narrowest useful tests, launch implementation reviewers through internal Codex subagents instead of dispatch or Claude, launch or explicitly skip $ai-readiness-upkeep with not-applicable evidence, print the launched reviewer report with returned subagent IDs in-session, validate the launch report, reconcile and validate reviewer outcomes including any ai_readiness_upkeep_report, run $review-feedback-routing, open or update the routed PR/MR or direct publish only when repo policy allows it, run artifact-host review, wait for routed latest-head feedback, treat missing stale timed-out or unresolved required review feedback as blocking, iterate until feedback is resolved, watch artifact-host CI, and finish with the exact delivery state and validated final reviewer subagent report plus delivery gate ledger. Reject legacy plan_ready_handoff, reviewed_slices, slice_plan_review, plan_followthrough_slice_handoff, and followthrough-ledger inputs with needs_plan_ready."
