interface:
  display_name: "Plan Orchestrator"
  short_description: "Coordinate reviewed planning through delivery sequencing"
  default_prompt: "Use $plan-orchestrator for this request: <request>. If fuzzy, use brainstorming first, then write or update plans under .agents/plans and run $plan-ready. If plan-ready emits plan_delivery_handoff, create a plan_review_request and run $plan-review before implementation. If plan-ready emits openspec_blueprint, create the OpenSpec proposal through the configured OpenSpec propose entrypoint, run strict OpenSpec validation, then run $plan-review. Do not start implementation until $plan-review emits a valid planning_review handoff with mode stacked_delivery, gate_outcome ready_for_stack, stack base evidence, and a passed latest-head nitro_feedback_gate. On continue/resume, validate orchestrator_resume state before selecting work: planning MR, implementation stack order, current stack tip, every MR head SHA, every MR Nitro gate state, tasks.md fingerprint, and restack requirements. After reviewed planning exists, run $plan-unit-sequencer and let $plan-unit-delivery implement exactly one unit at a time, with each OpenSpec task delivered in one separate PR/MR. Do not accept ship_then_continue or stack_when_ready. Finish only with validated stack_ready after the planning MR and every implementation MR have passed latest-head Nitro gates, stack integrity evidence, all deliverable tasks checked, and restack_required false. Write a concise Readable Summary before any YAML or JSON contract."
