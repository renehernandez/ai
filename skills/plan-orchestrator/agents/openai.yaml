interface:
  display_name: "Plan Orchestrator"
  short_description: "Orchestrate atomic or multi-step plan delivery"
  default_prompt: "/goal Use $plan-orchestrator with this plan_delivery_handoff or OpenSpec change: <handoff or change>. For atomic plans, validate the handoff and pass exactly one approved unit to $plan-unit-delivery. For OpenSpec changes, normalize delivery_goal as next_task, complete_change, or bounded_sequence, and landing_mode as ship_then_continue or stack_when_ready. Validate OpenSpec, resolve target branch and publishing remote, record the selection base commit, read tasks.md from target state or stack tip state as appropriate, select the first unchecked deliverable task, and pass exactly that task to $plan-unit-delivery. Let $plan-unit-delivery own implementation reviewer subagents for each unit. In ship_then_continue, refresh target branch after each landed unit. In stack_when_ready, continue only after the current PR/MR is ready for merge, verify cumulative stack-tip task state, then stack the next unit on the stack tip. Do not create a ledger. Reject legacy plan_coordinate_handoff, plan_ready_handoff, reviewed_slices, slice_plan_review, plan_followthrough_slice_handoff, and followthrough-ledger inputs with needs_plan_ready."
