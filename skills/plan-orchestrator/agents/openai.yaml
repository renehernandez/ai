interface:
  display_name: "Plan Orchestrator"
  short_description: "Coordinate reviewed planning through delivery sequencing"
  default_prompt: "Use $plan-orchestrator for this request: <request>. If fuzzy, use brainstorming first, then write or update primary atomic plan markdown under .agents/plans and run $plan-ready. Keep support workflow artifacts such as review requests, reviewer selections, handoffs, blueprints, ledgers, reports, validation inputs, and validation outputs in the thread by default; when file-backed recovery or correlation is needed, keep private support copies outside the repo. Do not commit .agents/plans support sidecars. If plan-ready emits plan_delivery_handoff, create a plan_review_request that carries the explicit readiness_reviewer_evidence from the validated plan-ready output, then run $plan-review before implementation. If plan-ready emits openspec_blueprint, first confirm the source .agents/plans intake file is not already committed; if committed, block and repair the branch instead of publishing a deletion-only source-plan diff. Then create the OpenSpec proposal, run strict validation and repo-local OpenSpec scaffolding validation when available, preserve the source plan if creation or validation fails, and delete it before $plan-review only after all creation and validation steps pass by calling cleanup-source-plan with --source-plan plus --expected-source-plan from openspec_blueprint.source_plan.ref and --expected-change-id from openspec_blueprint.source_plan.change_id. Do not infer expected cleanup authority by scanning .agents/plans or by defaulting it from --source-plan or --change-id. OpenSpec planning diffs must contain no .agents/plans paths; atomic plan artifacts may keep only the primary .agents/plans markdown plan. For materialized OpenSpec changes, create a plan_review_request that carries both explicit readiness_reviewer_evidence and blueprint_provenance before running $plan-review. Do not start implementation until $plan-review emits a valid planning_review handoff with mode stacked_delivery, gate_outcome ready_for_stack, stack base evidence, and a passed latest-head nitro_feedback_gate. Before sequencing, verify the review and stack artifacts are Nitro-supported Fullscript GitLab merge requests; unsupported hosts must produce delivery_blocked with routing evidence. On continue/resume, validate orchestrator_resume state before selecting work: planning MR, implementation stack order, current stack tip, every MR head SHA, every MR Nitro gate state, phase_evidence freshness for readiness/planning_commit/delivery, predecessor artifact evidence, delivery-unit delta validation, cumulative delivery-unit state evidence, concrete tasks.md content, unit-to-artifact evidence, restack requirements, and absence of lifecycle-only, validation-only, proof-only, or manual-looking proof task shapes. Route missing or stale readiness evidence to $plan-ready, planning commit evidence to $plan-review, and delivery evidence to $plan-unit-delivery; do not repair those phase outputs inside $plan-orchestrator. If resume or stack validation reports needs_spec_redesign, stop and ask the user whether to redo the spec, brainstorm, narrow scope, or choose another route before continuing delivery. Continue only from resume_ready; otherwise report delivery_blocked. After reviewed planning exists, run $plan-unit-sequencer and let $plan-unit-delivery implement exactly one delivery unit at a time, with each OpenSpec delivery unit delivered in one separate PR/MR. Do not accept ship_then_continue or stack_when_ready. Finish only with validated stack_ready after the planning MR and every implementation MR have passed latest-head Nitro gates, stack integrity evidence, all delivery units complete, no invalid lifecycle/proof-only task shapes, and restack_required false. If the workflow cannot reach stack_ready, report delivery_blocked and do not treat partial OpenSpec delivery as success. Write a concise Readable Summary before any YAML or JSON contract."
