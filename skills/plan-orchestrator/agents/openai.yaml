version: 1
agents:
  - id: plan-orchestrator
    default_prompt: "Use $plan-orchestrator for this request: <request>. If fuzzy, use brainstorming first, then write or update plans under .agents/plans and run $plan-ready. If plan-ready emits plan_delivery_handoff, create a plan_review_request and run $plan-review before implementation. If plan-ready emits openspec_blueprint, create the OpenSpec proposal through the configured OpenSpec propose entrypoint, run strict OpenSpec validation, then run $plan-review. Do not start implementation until $plan-review emits a valid planning_review handoff. After reviewed planning exists, run $plan-unit-sequencer and let $plan-unit-delivery implement exactly one unit at a time. Use ship_then_continue or stack_when_ready according to the user's requested delivery mode. Write a concise Readable Summary before any YAML or JSON contract."
