interface:
  display_name: "Plan Orchestrator"
  short_description: "Orchestrate atomic or multi-step plan delivery"
  default_prompt: "/goal Use $plan-orchestrator with this plan_delivery_handoff or OpenSpec change: <handoff or change>. For atomic plans, validate the handoff and pass exactly one approved unit to $plan-unit-delivery. For OpenSpec changes, normalize the delivery goal as next_task, complete_change, or bounded_sequence, validate OpenSpec, resolve and refresh the target branch and publishing remote, record the target commit, read tasks.md from target state, select the first unchecked deliverable task, and pass exactly that task to $plan-unit-delivery. For complete_change or bounded_sequence, refresh target branch after each landed unit and repeat until the requested target is reached or blocked. Do not create a ledger. Reject legacy plan_coordinate_handoff, plan_ready_handoff, reviewed_slices, slice_plan_review, plan_followthrough_slice_handoff, and followthrough-ledger inputs with needs_plan_ready."
