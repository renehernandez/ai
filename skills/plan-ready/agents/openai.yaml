interface:
  display_name: "Plan Ready"
  short_description: "Prepare atomic delivery handoffs or OpenSpec blueprints"
  default_prompt: "Use $plan-ready for <idea, plan, OpenSpec change, or Linear ticket>. Inspect live repo context and the planning artifact, apply the atomicity gate, launch required plan reviewers and selected optional reviewers as internal subagents, and emit exactly one validated output: plan_delivery_handoff for one atomic approved unit, openspec_blueprint for complex multi-deliverable work ready for mechanical OpenSpec creation, or blocked_readiness when required decisions are missing. For plan-file-backed OpenSpec blueprints, include source_plan.ref with the .agents/plans source artifact and source_plan.change_id matching change.suggested_id so plan-orchestrator can pass them as --expected-source-plan and --expected-change-id during cleanup. In openspec_blueprint.review, include required_reviewers for the baseline reviewers, optional_reviewers for selected catalog reviewers, and preserve reviewers_used plus findings as the review execution summary. In plan-orchestrator flows, readiness is not terminal completion; plan_delivery_handoff or openspec_blueprint only authorizes planning review, and orchestrator delivery can finish only as stack_ready or delivery_blocked. Always write a concise Readable Summary before the YAML so the thread is scannable on mobile. Reject legacy slice_plan_review reviewed_slices plan_coordinate_handoff plan_ready_handoff and plan_followthrough_slice_handoff inputs with needs_plan_ready, and stop before $plan-orchestrator continuation, $plan-unit-sequencer, $plan-unit-delivery, implementation, hosted review, or writing OpenSpec files."
