interface:
  display_name: "Plan Ready"
  short_description: "Review and harden a plan before implementation"
  default_prompt: "Use $plan-ready for <idea, plan, OpenSpec change, or Linear ticket>. Prepare the authoritative local planning artifact, run $plan-slices to create or audit implementation slices, require a current passing slice_plan_review with a matching local plan file fingerprint, use the reviewer-selection judge for optional reviewers, run required reviewers including refactoring-opportunities through internal Codex subagents instead of dispatch or Claude, keep minor local behavior-preserving refactors inside the slice, turn significant refactors into proposed refactoring slices that block readiness until brainstorming and plan review rerun, resolve blocking findings, rerun $plan-slices after plan edits, run $scrutinize on the final plan, emit a validated slice_plan_review plus plan_ready_handoff, and stop for user verification before $plan-followthrough."
