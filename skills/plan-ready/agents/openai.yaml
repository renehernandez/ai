interface:
  display_name: "Plan Ready"
  short_description: "Route planning input to atomic delivery or OpenSpec"
  default_prompt: "Use $plan-ready for <idea, plan, OpenSpec change, or Linear ticket>. Inspect live repo context and the planning artifact, apply the atomicity gate, return needs_openspec for multi-deliverable work instead of creating slices, run required plan reviewers and selected optional reviewers for atomic work, run final scrutiny, emit a validated plan_coordinate_handoff for one atomic approved unit, reject legacy slice_plan_review reviewed_slices plan_ready_handoff and plan_followthrough_slice_handoff inputs with needs_plan_ready, and stop before $plan-coordinate or implementation."
