interface:
  display_name: "Plan Ready"
  short_description: "Prepare atomic delivery handoffs or OpenSpec blueprints"
  default_prompt: "Use $plan-ready for <idea, plan, OpenSpec change, or Linear ticket>. Inspect live repo context and the planning artifact, apply the atomicity gate, launch required plan reviewers and selected optional reviewers as internal subagents, and emit exactly one validated output: plan_delivery_handoff for one atomic approved unit, openspec_blueprint for complex multi-deliverable work ready for mechanical OpenSpec creation, or blocked_readiness when required decisions are missing. Primary atomic plan markdown may be written under .agents/plans; support workflow artifacts such as review requests, reviewer selections, handoffs, blueprints, ledgers, reports, validation inputs, and validation outputs must stay in the thread by default and may be recorded privately with pnpm ax plans artifact record --plan PLAN --kind KIND --file FILE for recovery. Do not commit .agents/plans support sidecars. Select docs-and-agent-alignment for workflow, docs, skills, rules, automation prompt, reviewer rubric, local workflow artifact boundary, or PR/MR description contract changes; select ax-and-skill-compatibility for skill scripts, adapter prompts, internal subagent routing, install/update behavior, Agents Experience behavior, or runtime compatibility changes. Each baseline reviewer must report lifecycle-only task groups, validation-only tasks, proof-only tasks, final documentation or validation phases, checkbox-only delivery units, late objective proof, and committed local workflow artifacts as blocking planning-readiness findings before readiness succeeds, not suggestions or follow-up cleanup. For openspec_blueprint output, tasks must be deliverable units; never create final documentation, testing, linting, review, validation, verification, proof, cleanup phases, or more than one setup-only task before objective proof. Put those activities inside the related deliverable task acceptance or verification work, except when docs, tests, validation, CI, reviewer tooling, runtime validation tooling, or reusable AI workflow machinery is the feature itself. Blueprint tasks must include explicit Proof location: or First real confirmation: wording in task 1, or in task 2 after at most one setup-only task, naming the real entrypoint and visible success or failure evidence. If validate-blueprint reports needs_spec_redesign for lifecycle-only, validation-only, proof-only, manual-looking proof tasks, or missing/late/implicit objective proof, block and ask whether to redo the breakdown, brainstorm, narrow scope, or choose another planning route; do not silently rewrite or create OpenSpec files. For plan-file-backed OpenSpec blueprints, include source_plan.ref with the .agents/plans source artifact and source_plan.change_id matching change.suggested_id so plan-orchestrator can pass them as --expected-source-plan and --expected-change-id during cleanup. In plan-orchestrator flows, readiness is not terminal completion; plan_delivery_handoff or openspec_blueprint only authorizes planning review, and orchestrator delivery can finish only as stack_ready or delivery_blocked. Always write a concise Readable Summary before the YAML so the thread is scannable on mobile. Reject legacy slice_plan_review reviewed_slices plan_coordinate_handoff plan_ready_handoff and plan_followthrough_slice_handoff inputs with needs_plan_ready, and stop before $plan-orchestrator continuation, $plan-unit-sequencer, $plan-unit-delivery, implementation, hosted review, or writing OpenSpec files."
