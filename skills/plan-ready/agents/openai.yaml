interface:
  display_name: "Plan Ready"
  short_description: "Prepare atomic delivery handoffs or OpenSpec blueprints"
  default_prompt: "Use $plan-ready for <idea, plan, OpenSpec change, or Linear ticket>. Inspect live repo context and the planning artifact, apply the atomicity gate, launch required plan reviewers and selected optional reviewers as internal subagents, and emit exactly one validated output: plan_delivery_handoff for one atomic approved unit, openspec_blueprint for complex multi-deliverable work ready for mechanical OpenSpec creation, or blocked_readiness when required decisions are missing. Reject legacy slice_plan_review reviewed_slices plan_coordinate_handoff plan_ready_handoff and plan_followthrough_slice_handoff inputs with needs_plan_ready, and stop before $plan-orchestrator, $plan-unit-delivery, implementation, hosted review, or writing OpenSpec files."
