interface:
  display_name: "Plan Ready"
  short_description: "Review and harden a plan before implementation"
  default_prompt: "Use $plan-ready for <idea, plan, OpenSpec change, or Linear ticket>. Prepare the authoritative planning artifact, run required dispatch plan reviewers, use the reviewer-selection judge for optional reviewers, resolve blocking findings, run $scrutinize on the final plan, emit a validated plan_ready_handoff, and stop for user verification before implementation."
