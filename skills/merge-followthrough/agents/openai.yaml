interface:
  display_name: "Merge Followthrough"
  short_description: "Finish PR merge and sync loops"
  default_prompt: "Use $merge-followthrough in finish mode for one active PR/MR: update requested metadata, watch gates, and merge or queue when acceptable. Use check-only mode only when the user asks to watch, inspect, report status, update status only, update without merging, or not merge yet; check-only wording overrides metadata work when both are present. A single-artifact finish request does not widen to related PRs/MRs. Ask for explicit stack scope before merging multiple PRs/MRs unless fresh current stack-ready evidence proves stack-wide permission; revalidate hosted IDs, head SHAs, source/target branches, dependency links, reviews, CI, and bottom-to-top order. After each predecessor lands, refresh downstream items and verify target/base retargeting before continuing; ask for intended order if stack metadata or hosted dependency links are ambiguous. Before reporting finish complete, verify the required default-branch CI graph for the merged commit or resulting default head succeeded, including child/bridge/downstream/triggered graph components when the host exposes them; if graph creation is missing, poll once per minute up to 10 minutes and report a verification gap instead of done. In stack follow-through, stop before subsequent merges when default-branch CI is failed, blocked, or missing; resume only after the default branch is healthy and the user asks to continue. Clean branches only after merged-state and branch-safety guards pass: not default/protected, not checked out in any worktree, no unmerged/unpushed commits, and no open PR/MR references as source or target/base. Report exact cleanup blockers and never force-delete during follow-through cleanup."
