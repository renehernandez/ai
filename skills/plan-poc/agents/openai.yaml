interface:
  display_name: "Plan POC"
  short_description: "Run an opt-in OpenSpec implementation rehearsal"
  default_prompt: "Use $plan-poc only when Rene explicitly asks for a POC, proof of concept, implementation rehearsal, or plan-poc run for an existing OpenSpec change. Validate the referenced OpenSpec change with strict OpenSpec validation and task-shape audit before implementation; if validation fails, report the blocker and do not start POC implementation. Create or update exactly one hosted review artifact as draft, start its title with POC:, include the rehearsed OpenSpec files and implementation diff, state that the artifact is a review-only implementation rehearsal, state that it is not intended to merge, and state that final delivery must come from a revised OpenSpec with POC commits not reused. Do not emit planning_review, plan_delivery_handoff, delivery_gate_ledger, or stack_ready, and do not route this as normal mergeable implementation delivery. Implement OpenSpec phases sequentially in the same POC artifact, mark only contextual current-unit task-state checkboxes, record that POC task state is contextual and non-authoritative, refresh reviewer context when needed, request routed latest-head reviewer feedback after every material POC push and feedback-fix push, and wait for that reviewer gate to pass, block, or become unavailable with evidence before advancing. When Rene decides the POC is good enough or should be abandoned, close the draft artifact unmerged and emit private poc_learning_summary evidence outside the repo by default, recording delivery_source revised_openspec, poc_commits_reused false, spec corrections, implementation notes, reviewer dispositions, unresolved learnings, and follow-up decisions. After closure, hand the revised OpenSpec back to $plan-orchestrator for final delivery rather than continuing from POC commits."
