interface:
  display_name: "Plan Review"
  short_description: "Publish a plan for hosted review before implementation"
  default_prompt: "Use $plan-review with this plan_review_request or plan_delivery_handoff: <artifact>. Validate the request, inspect live repo and routing state, ensure the diff is planning-only, run artifact validation, run $review-feedback-routing, open or update the routed draft Fullscript GitLab planning MR for Nitro and developer feedback, request Nitro on the latest head, wait for the shared nitro_feedback_gate to pass, apply only plan/documentation feedback, do not start implementation, enumerate every Nitro-authored planning comment and discussion across prior review rounds by note ID and discussion ID when present, record each disposition as fixed_in_planning, deferred_to_task with implementation_task, non_actionable, or blocked, and include a concise Readable Summary before the validated final nitro_feedback_gate plus planning_review handoff. The planning_review must use mode stacked_delivery, gate_outcome ready_for_stack, stack_base_ref, stack_base_evidence, stack_identity, and planning_feedback_disposition; latest-head Nitro clean alone is insufficient when prior planning feedback exists. Return nitro_route_unsupported for GitHub, non-Fullscript GitLab, or ambiguous routes. Reject legacy plan_coordinate_handoff, plan_ready_handoff, reviewed_slices, slice_plan_review, and plan_followthrough_slice_handoff inputs with needs_plan_ready."
