interface:
  display_name: "Plan Review"
  short_description: "Publish a plan for hosted review before implementation"
  default_prompt: "Use $plan-review with this plan_review_request or plan_delivery_handoff: <artifact>. Validate the request, including readiness_reviewer_evidence for plan_review_request inputs, inspect live repo and routing state, ensure the diff is planning-only, and for artifact_type openspec reject any .agents/plans path in the planning diff, including added, modified, deleted, renamed, copied, or type-changed paths; artifact_type plan may still use the primary .agents/plans markdown plan as the reviewed artifact, but support workflow sidecars under .agents/plans must be rejected and kept in the thread or private support storage outside the repo. Run artifact validation. For artifact_type openspec, from the skills/plan-review folder run pnpm exec tsx scripts/plan-review.ts validate-openspec-tasks --artifact-ref <artifact_ref> before publishing or updating a planning PR/MR; if it returns needs_spec_redesign for lifecycle-only, validation-only, proof-only, or manual-looking proof task shapes, block, ask the user whether to redo the spec, brainstorm, narrow scope, or choose another planning route, and do not rewrite tasks.md or create/update the planning artifact. Run $review-feedback-routing, open or update the routed draft Fullscript GitLab planning MR for Nitro and developer feedback, then run the hosted-description gate through the selected description policy owner before requesting Nitro: read existing hosted body before update when present, preserve manual/template/reviewer content, read back the current hosted body at the planning head, restore or block on bad update, omit author-process history and private/local workflow artifacts, and record passed description_policy evidence with readback_outcome. Request Nitro on the latest head, wait for the shared nitro_feedback_gate to pass, apply only plan/documentation feedback, do not start implementation, and do not expose local private support paths, raw private support artifacts, or private thread metadata in hosted descriptions; use summaries, hashes, note IDs, discussion IDs, or stable correlation IDs. Enumerate every Nitro-authored planning comment and discussion across prior review rounds by note ID and discussion ID when present, record each disposition as fixed_in_planning, deferred_to_task with implementation_task, non_actionable, or blocked, and include a concise Readable Summary before the validated final nitro_feedback_gate plus planning_review handoff. The planning_review must use mode stacked_delivery, gate_outcome ready_for_stack, stack_base_ref, stack_base_evidence, stack_identity, description_policy tied to review_artifact and reviewed_head, and planning_feedback_disposition; validate it with expected artifact/head values from live host inspection, because latest-head Nitro clean alone is insufficient when prior planning feedback exists. In plan-orchestrator flows planning_review is a sequencing handoff, not terminal success, and only stack_ready or delivery_blocked can finish orchestrator delivery. Return nitro_route_unsupported for GitHub, non-Fullscript GitLab, or ambiguous routes. Reject legacy plan_coordinate_handoff, plan_ready_handoff, reviewed_slices, slice_plan_review, and plan_followthrough_slice_handoff inputs with needs_plan_ready."
