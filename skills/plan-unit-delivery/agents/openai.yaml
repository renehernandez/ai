interface:
  display_name: "Plan Unit Delivery"
  short_description: "Implement one approved unit through review and delivery"
  default_prompt: "/goal Use $plan-unit-delivery with this plan_delivery_handoff: <handoff>. Validate the handoff, inspect live repo and routing state, implement exactly the approved_unit, and if the route is openspec_task mark only that OpenSpec task checkbox complete in the same PR, MR, or direct-publish commit as the implementation. For openspec_task, run validate-task-delta against base and unit tasks.md and require exactly one expected deliverable task to change from unchecked to checked. Keep minor local behavior-preserving refactors inside the approved unit, record naturally discovered significant_refactor_suggestions as nonblocking carry-forward unless they invalidate the approved unit, run local verification named by the handoff plus the narrowest useful tests, launch implementation reviewers through internal subagents, launch or explicitly skip $ai-readiness-upkeep with not-applicable evidence, print the launched reviewer report with returned subagent IDs in-session, validate the launch report, reconcile and validate reviewer outcomes including any ai_readiness_upkeep_report, run $review-feedback-routing, open or update the routed PR/MR or direct publish only when repo policy allows it, run artifact-host review when a PR/MR exists, monitor latest-head pipelines until passed failed blocked or unavailable with evidence, wait for routed latest-head automatic review feedback until feedback is resolved or no feedback is posted after an explicit timeout, treat stale timed-out unresolved or missing required review feedback as blocking unless timeout evidence proves none posted, iterate until feedback and pipelines are resolved, and finish with the exact delivery state and validated final reviewer subagent report plus delivery gate ledger. Reject legacy plan_coordinate_handoff, plan_ready_handoff, reviewed_slices, slice_plan_review, plan_followthrough_slice_handoff, and followthrough-ledger inputs with needs_plan_ready."
