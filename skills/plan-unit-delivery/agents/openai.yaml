interface:
  display_name: "Plan Unit Delivery"
  short_description: "Implement one approved unit through review and delivery"
  default_prompt: "/goal Use $plan-unit-delivery with this plan_delivery_handoff: <handoff>. Validate the handoff, inspect live repo and routing state, implement exactly the approved_unit, and if the route is openspec_task mark only that OpenSpec task checkbox complete in the same implementation PR/MR as the task implementation. For openspec_task, deliver the selected task in one separate stacked PR/MR, allowing multiple commits inside that PR/MR, and run validate-task-delta against base and unit tasks.md to require exactly one expected deliverable task to change from unchecked to checked. Preserve one-unit delivery evidence in delivery_gate_ledger: selected task ID, selected task base SHA, predecessor artifact, implementation artifact URL/ref, implementation head SHA, validate-task-delta command, unit_task_delta_valid output, description_policy evidence tied to the implementation artifact and head, pipeline or unavailable evidence, Nitro evidence, and restack state. Keep minor local behavior-preserving refactors inside the approved unit, record naturally discovered significant_refactor_suggestions as nonblocking carry-forward unless they invalidate the approved unit, run local verification named by the handoff plus the narrowest useful tests, launch implementation reviewers through internal subagents, launch or explicitly skip $ai-readiness-upkeep with not-applicable evidence, print the launched reviewer report with returned subagent IDs in-session, validate the launch report, reconcile and validate reviewer outcomes including any ai_readiness_upkeep_report, run $review-feedback-routing, open or update the routed implementation PR/MR stacked on the expected stack tip, run the hosted-description gate through the selected description policy owner before artifact-host review or Nitro request: read existing hosted body before update when present, preserve manual/template/reviewer content, read back the current hosted body at the implementation head, restore or block on bad update, omit raw ledgers, local paths, subagent gates, and author-only plan iteration, and record passed description_policy evidence with readback_outcome. Run artifact-host review, monitor latest-head pipelines until passed failed blocked or unavailable with evidence, request Nitro after MR creation and after every material head-changing push after refreshing description_policy when the change affects reviewer understanding, validate the latest-head nitro_feedback_gate and delivery_gate_ledger with expected artifact/head values from live host inspection, treat pending stale unavailable findings unresolved or missing required Nitro feedback as blocking, rerun the full Nitro gate for restacked descendant heads, iterate until feedback and pipelines are resolved, and finish with the exact delivery state and validated final reviewer subagent report plus nitro_feedback_gate and delivery_gate_ledger. Always write a concise Readable Summary before final YAML reports so the thread is scannable on mobile. Reject legacy plan_coordinate_handoff, plan_ready_handoff, reviewed_slices, slice_plan_review, plan_followthrough_slice_handoff, and followthrough-ledger inputs with needs_plan_ready."
