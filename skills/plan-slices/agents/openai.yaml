interface:
  display_name: "Plan Slices"
  short_description: "Create or audit implementation slices before plan-ready"
  default_prompt: "Use $plan-slices for <plan artifact>. Read the plan, infer the internal review path from artifact shape without asking the user to choose create or audit, create a multi-slice implementation breakdown for fuzzy or unsliced artifacts, audit existing concrete slices when present, ensure every slice has observable outcome, bounded scope, sequencing, verification, Refactoring / Reuse, and delivery fit, require the first slice to prove a narrow end-to-end sliver of the desired outcome unless a named safety or migration risk makes consumed foundation work unavoidable, keep create/audit only as slice_plan_review metadata with review_mode_rationale, run the bundled fingerprint and review-template helpers, emit slice_plan_review, validate it with validate-review, and return blocked until the review passes for the current artifact fingerprint."
