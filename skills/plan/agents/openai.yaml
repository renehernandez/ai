interface:
  display_name: "Plan"
  short_description: "Settle decisions and review one artifact"
  default_prompt: "Use $plan to settle material decisions conversationally, select exactly one atomic Markdown plan or OpenSpec semantically, keep it focused on the high-level approach and end-to-end outcome, and decompose every final MR as one top-level unit with local proof. Prefer stack objective proof in unit 1, but allow at most two independently valuable groundwork units when they directly enable a named successor and reduce the first outcome MR's risk. Repair contract-preserving validator failures without renewed permission, run local planning Review, require a full disposable POC for every OpenSpec, and create no planning MR."
