interface:
  display_name: "Plan"
  short_description: "Settle decisions and review one artifact"
  default_prompt: "Use $plan to settle material decisions conversationally, select exactly one atomic Markdown plan or OpenSpec semantically, keep it focused on the high-level approach and end-to-end outcome, and decompose every final MR as one top-level unit with local proof. Prefer stack objective proof in unit 1, but allow at most two independently valuable groundwork units when they directly enable a named successor and reduce the first outcome MR's risk. Treat pre-POC units as provisional; after the accepted POC, require the explicit post_poc checkpoint lifecycle plus fingerprint-bound planning Review evidence for every final unit and material footprint entry before freezing the execution seed. Repair contract-preserving validator failures without renewed permission, require a full disposable POC for every OpenSpec, and create no planning MR."
